name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  validate:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/isaac/package-lock.json
      - name: Resolve build version
        id: version
        shell: pwsh
        run: |
          $version = '0.0.0-dev'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw "Release tag must use vMAJOR.MINOR.PATCH: $env:GITHUB_REF_NAME"
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -Version '${{ steps.version.outputs.version }}'
      - name: Publish portable client
        if: github.ref_type != 'tag'
        shell: pwsh
        run: ./scripts/publish.ps1 -Runtime win-x64 -Version '${{ steps.version.outputs.version }}' -SkipTests
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: LabDesktopClient-win-x64
          path: artifacts/publish/win-x64/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/isaac/package-lock.json
      - name: Validate release source
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tag must point to a commit contained in main.'
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build release assets
        shell: pwsh
        run: ./scripts/release.ps1 -Version '${{ needs.validate.outputs.version }}' -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: LabDesktopClient-${{ needs.validate.outputs.version }}-release
          path: artifacts/release/
          if-no-files-found: error
      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = '${{ needs.validate.outputs.version }}'
          $assets = Get-ChildItem -LiteralPath artifacts/release -File |
            Sort-Object Name |
            ForEach-Object FullName

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $tag @assets `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --title "Lab Desktop Client $version" `
              --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
